# SonarCloud / SonarQube project descriptor — runs in CI to enforce
# rule 10 of the implementation command: 0 code smells, 0% duplication
# (alongside Jest's 100% coverage threshold and ESLint's 0/0 baseline).
# Local execution is impractical without a token; CI exports the report
# from /coverage/lcov.info and uploads via sonar-scanner.

sonar.projectKey=technical-lead-practical-assessment
sonar.organization=assessment-sura-tech
sonar.projectName=Technical Lead Practical Assessment
sonar.projectVersion=1.0.0

sonar.sources=packages/integration-framework/src,src/contexts
sonar.tests=test
sonar.test.inclusions=test/**/*.spec.ts
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,docs/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# Quality gate enforced server-side. Local proxy gates:
#   - duplication: ESLint `no-duplicate-imports` + Jest 100% coverage
#   - code smells: ESLint flat config (recommended + typescript-eslint)
#   - bugs: tsc --noEmit (strict)
sonar.qualitygate.wait=true
