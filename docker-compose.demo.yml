# Demo stack for the integration framework (rule 11 of the implementation command).
# Brings up Redis (cache-aside / idempotency store), the OpenTelemetry Collector
# and Jaeger as the trace backend so the channel/upstream services can export
# OTLP traces and we can observe the breaker / retry / timeout flows end-to-end.
services:
  redis:
    image: redis:7-alpine
    container_name: assessment-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: assessment-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "13133:13133" # health check extension
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: assessment-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # collector gRPC
